name: Update projects

on:
    schedule:
        - cron: "30 5 * * *"
    workflow_dispatch:
        inputs:
            head-branch:
                description: "Branch name to push project updates"
                type: string
                default: "automation/projects-update"
            base-branch:
                description: "Target branch for the pull request"
                type: string
                default: "main"

jobs:
    update-projects:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: "1.1.24"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Update projects dataset
              run: bun run projects:update

            - name: Create pull request
              uses: peter-evans/create-pull-request@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  branch: ${{ inputs.head-branch || 'automation/projects-update' }}
                  base: ${{ inputs.base-branch || 'main' }}
                  title: "Update projects"
                  body: |
                      Automated sync of projects from arctracker.io.

                      - Triggered by: ${{ github.actor }}
                  commit-message: "chore: update projects"
                  author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
                  committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
                  add-paths: |
                      projects.json
                  labels: |
                      automation
                  draft: false
                  delete-branch: true
                  signoff: false
                  skip-if-empty: true

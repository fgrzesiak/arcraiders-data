name: Update map events

on:
    schedule:
        - cron: "0 5 * * *"
    workflow_dispatch:
        inputs:
            base-branch:
                description: "Only sync this branch (empty = main and mainv2)"
                type: string
                default: ""

jobs:
    update-map-events:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # The app reads mainv2 in production; main is the default branch.
                base: ${{ fromJSON(inputs.base-branch && format('["{0}"]', inputs.base-branch) || '["main", "mainv2"]') }}
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ matrix.base }}
                  fetch-depth: 0

            - name: Install Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: "1.1.24"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Update map events dataset
              run: bun run map-events:update

            - name: Create pull request
              uses: peter-evans/create-pull-request@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  branch: ${{ matrix.base == 'main' && 'automation/map-events-update' || format('automation/map-events-update-{0}', matrix.base) }}
                  base: ${{ matrix.base }}
                  title: "Update map events (${{ matrix.base }})"
                  body: |
                      Automated sync of map-events from arctracker.io.

                      - Triggered by: ${{ github.actor }}
                  commit-message: "chore: update map events"
                  author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
                  committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
                  add-paths: |
                      map-events/map-events.json
                  labels: |
                      automation
                  draft: false
                  delete-branch: true
                  signoff: false
                  skip-if-empty: true

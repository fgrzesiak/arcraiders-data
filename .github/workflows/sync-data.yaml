name: Sync data

on:
    schedule:
        - cron: "0 5 * * *"
    workflow_dispatch:
        inputs:
            base-branch:
                description: "Only sync this branch (empty = main and mainv2)"
                type: string
                default: ""

jobs:
    sync:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # The app reads mainv2 in production; main is the default branch.
                base: ${{ fromJSON(inputs.base-branch && format('["{0}"]', inputs.base-branch) || '["main", "mainv2"]') }}
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ matrix.base }}
                  fetch-depth: 0

            - name: Install Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: "1.1.24"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Fetch all datasets (map events have their own workflow), format them, then rebuild the aggregates, so a
            # single PR contains everything and needs no follow-up commit.
            - name: Sync all datasets
              run: bun run sync

            - name: Create pull request
              uses: peter-evans/create-pull-request@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  branch: ${{ matrix.base == 'main' && 'automation/data-sync' || format('automation/data-sync-{0}', matrix.base) }}
                  base: ${{ matrix.base }}
                  title: "Sync data from arctracker.io (${{ matrix.base }})"
                  body: |
                      Automated sync of items, quests, hideout, projects and ARC enemies (bots.json) from arctracker.io, including the rebuilt aggregate files.

                      - Triggered by: ${{ github.actor }}
                  commit-message: "chore: sync data from arctracker.io"
                  author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
                  committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
                  add-paths: |
                      items/
                      quests/
                      hideout/
                      projects.json
                      bots.json
                      items.json
                      quests.json
                      hideoutModules.json
                  labels: |
                      automation
                  draft: false
                  delete-branch: true
                  signoff: false
                  skip-if-empty: true
